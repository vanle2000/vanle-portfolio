# =========================
# Minimal Mistakes
# =========================

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "air"

# Site
locale: "en-US"
title: "Van (Elizabeth) Le"
description: "Business Intelligence Engineer | Data Analyst | Data Scientist"
url: "https://vanle2000.github.io"
baseurl: "/vanle-portfolio"

masthead_title: ""

# Author
author:
  name: "Van (Elizabeth) Le"
  avatar: "/assets/images/headshot.jpg"
  bio: "Business Intelligence Engineer | Data Analyst | Data Scientist"
  location: "Houston, TX"
  email: "vanle.vtl2000@gmail.com"
  links:
    - label: "Email"
      url: "mailto:vanle.vtl2000@gmail.com"
    - label: "GitHub"
      url: "https://github.com/vanle2000/"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/elizabethvanle/"

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Build
include:
  - _pages
  - _projects

exclude:
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README
  - tmp
  - /docs
  - /test

encoding: "utf-8"
markdown: kramdown

# URLs
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# Search (optional)
search: false

# Plugins (single list only)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# Defaults 
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false

  - scope:
      path: ""
      type: projects
    values:
      layout: project
      author_profile: false
